name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Run in two timezones: date math bugs often only show up in one of them.
        tz: [UTC, Asia/Jerusalem]
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Check JS syntax
        run: for f in js/*.js sw.js; do node --check "$f"; done
